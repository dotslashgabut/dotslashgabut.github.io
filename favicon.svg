<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="edge">
      <rect width="32" height="32" rx="5"/>
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="5" fill="#08080c"/>

  <g clip-path="url(#edge)">
    <g transform="rotate(22 16 16)">
      <!-- traces -->
      <g stroke="#f2f2f0" stroke-width="2.6" stroke-linecap="square">
        <path d="M16,12 V4"/>
        <path d="M16,20 V28"/>
        <path d="M12,16 H4"/>
      </g>
      <path d="M20,16 H28" stroke="#00e5ff" stroke-width="2.6" stroke-linecap="square"/>

      <!-- chip -->
      <rect x="11.5" y="11.5" width="9" height="9" rx="1.6" fill="#15151b" stroke="#f2f2f0" stroke-width="2.4"/>

      <!-- pads -->
      <circle cx="16" cy="4" r="2.1" fill="#f2f2f0"/>
      <circle cx="16" cy="28" r="2.1" fill="#f2f2f0"/>
      <circle cx="4" cy="16" r="2.1" fill="#f2f2f0"/>
      <circle cx="28" cy="16" r="2.1" fill="#00e5ff"/>
    </g>
  </g>
</svg>
